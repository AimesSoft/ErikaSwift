name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apple:
    name: Swift Package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and test macOS
        run: swift test

      - name: Build iOS
        run: |
          xcodebuild \
            -scheme Erika \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build tvOS
        run: |
          xcodebuild \
            -scheme Erika \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
